<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Explorador GitHub — Mini Sitio</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="container">
      <h1>Explorador de GitHub</h1>
      <p class="tagline">Busca un usuario de GitHub y explora sus datos públicos</p>

      <div class="search-row">
        <input 
          id="username" 
          placeholder="Ejemplo: octocat" 
          aria-label="Nombre de usuario de GitHub"
        />
        <button id="searchBtn">Buscar</button>
      </div>

      <!-- NUEVO: mensaje informativo -->
      <p class="helper-text">Tip: Puedes buscar cualquier usuario público de GitHub</p>

    </div>
  </header>

  <main class="container">
    <section id="profile" class="profile-card hidden">
      <!-- Perfil cargado por main.js -->
    </section>

    <section id="repos" class="repos-grid">
      <!-- Repos cargados por main.js -->
    </section>

    <!-- NUEVO: Loader visual simple -->
    <div id="status" class="status loader hidden"></div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <small>Mini sitio realizado como práctica de consumo de API, estilo y GitHub Flow.</small>
    </div>
  </footer>

  <script src="main.js" type="module"></script>
</body>
</html>
